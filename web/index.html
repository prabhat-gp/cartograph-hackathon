<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartograph</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2128; --muted: #6b7280; --line: #e4e2dc; --soft: #f0eee8;
    --accent: #2457d6; --accent-ink: #ffffff;
    --ok: #1f9d6b; --warn: #d99a21; --bad: #d1495b; --none: #c9c6bd;
    --code-bg: #fbfaf7; --sel: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1a1d25; --ink: #e7e9ee; --muted: #9aa1ad; --line: #2a2e39; --soft: #222632;
      --accent: #6b93ff; --accent-ink: #0b1020; --code-bg: #161921; --sel: #3a3415; --none: #3a3e4a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: .2px; display: flex; gap: 8px; align-items: center; }
  .brand svg { width: 22px; height: 22px; }
  .tag { color: var(--muted); font-size: 12px; }
  header select { margin-left: auto; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .status { font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 440px; height: calc(100vh - 51px); }
  aside, section { min-height: 0; overflow: auto; }
  aside.files { border-right: 1px solid var(--line); background: var(--panel); padding: 12px; }
  .summary { padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .summary h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .big { font-size: 26px; font-weight: 700; }
  .bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--none); margin: 6px 0; }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); }
  .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .filter { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 6px; }
  .file { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 6px; border-radius: 6px; cursor: pointer; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .file:hover { background: var(--soft); }
  .file.active { background: var(--soft); outline: 1px solid var(--line); }
  .file .mini { display: flex; height: 3px; border-radius: 2px; overflow: hidden; background: var(--none); margin-top: 4px; }
  .file .mini i { display: block; height: 100%; }
  section.code { background: var(--code-bg); }
  .codehead { position: sticky; top: 0; z-index: 2; background: var(--code-bg); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 10px; align-items: center; font: 12.5px ui-monospace, Menlo, monospace; }
  .codehead .hint { margin-left: auto; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
  pre { margin: 0; padding: 6px 0 40px; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ln { display: grid; grid-template-columns: 4px 52px 1fr; cursor: pointer; }
  .ln:hover { background: var(--soft); }
  .ln.sel { background: var(--sel); }
  .ln .g { background: var(--none); }
  .ln .n { color: var(--muted); text-align: right; padding-right: 12px; user-select: none; }
  .ln .t { white-space: pre; padding-right: 20px; }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  aside.ask { border-left: 1px solid var(--line); background: var(--panel); padding: 14px; }
  textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: progress; }
  .target { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .card h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .answer { font-size: 15px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .chip.high { color: var(--ok); border-color: var(--ok); } .chip.medium { color: var(--warn); border-color: var(--warn); } .chip.low { color: var(--bad); border-color: var(--bad); }
  .chain { list-style: none; margin: 0; padding: 0; }
  .chain li { position: relative; padding: 0 0 12px 22px; }
  .chain li::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: -6px; width: 2px; background: var(--line); }
  .chain li:last-child::before { display: none; }
  .chain li::after { content: ""; position: absolute; left: 2px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .chain .k { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .chain a, .ev a { color: var(--accent); text-decoration: none; }
  .claim { margin: 0 0 8px; }
  .cite { font: 11px ui-monospace, Menlo, monospace; color: var(--accent); cursor: help; }
  .ev { border-top: 1px dashed var(--line); padding: 8px 0; font-size: 13px; }
  .ev pre { white-space: pre-wrap; font-size: 11.5px; color: var(--muted); max-height: 140px; overflow: auto; }
  .trace { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
  .trace li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .trace .who { font-weight: 600; }
  .trace .st { font-size: 11px; color: var(--muted); }
  .trace .needs_revision .st { color: var(--warn); } .trace .error .st { color: var(--bad); }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; display: inline-block; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color: var(--bad); }
  .mem { font-size: 12.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
  button.fb { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button.fb:hover { background: var(--soft); }
  @media (max-width: 1100px) { main { grid-template-columns: 240px minmax(0, 1fr); } aside.ask { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } body { overflow: auto; height: auto; } main { height: auto; } section.code { max-height: 70vh; } }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } aside.files { max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
    Cartograph
  </div>
  <span class="tag">the agent that can explain why your code is the way it is</span>
  <select id="repo" aria-label="Repository"></select>
  <span class="status" id="health"></span>
</header>
<main>
  <aside class="files">
    <div class="summary" id="summary"><h3>Explainability</h3><div class="empty">Loading…</div></div>
    <div class="summary" id="memory"><h3>Memory · H-MEM</h3><div class="tag">Nothing remembered yet.</div></div>
    <input class="filter" id="filter" placeholder="Filter files" aria-label="Filter files">
    <div id="files"></div>
  </aside>
  <section class="code" id="code"><div class="empty">Pick a file. Click a line (shift-click for a range), then ask why.</div></section>
  <aside class="ask">
    <textarea id="question" placeholder="Why does this code do what it does?"></textarea>
    <div class="row">
      <button class="primary" id="go">Ask why</button>
      <span class="target" id="target">whole repository</span>
    </div>
    <div id="result"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = { explained: "var(--ok)", reviewed: "var(--warn)", none: "var(--bad)" };
const state = { repo: null, files: [], path: null, sel: null, ranges: [] };

async function api(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json();
  if (!res.ok && !body.status) throw new Error(body.error?.message ?? body.error ?? res.statusText);
  return body;
}

function split(c, lines) {
  const total = Math.max(lines, 1);
  if (!c) return { e: 0, r: 0, n: 0 };
  return { e: c.explained_lines / total, r: (c.reviewed_lines - c.explained_lines) / total, n: (c.blamed_lines - c.reviewed_lines) / total };
}
function barHtml(f, cls) {
  const s = split(f.coverage, f.lines);
  return `<div class="${cls}"><i style="width:${s.e * 100}%;background:${COLORS.explained}"></i><i style="width:${s.r * 100}%;background:${COLORS.reviewed}"></i><i style="width:${s.n * 100}%;background:${COLORS.none}"></i></div>`;
}

async function loadRepos() {
  const repos = await api("/api/repos");
  $("repo").innerHTML = repos.map((r) => `<option>${esc(r.id)}</option>`).join("");
  const prefer = repos.find((r) => r.id === "expressjs/express") ?? repos[0];
  if (prefer) { $("repo").value = prefer.id; await loadRepo(prefer.id); }
  api("/api/health").then((h) => ($("health").textContent = `model provider: ${h.provider}`)).catch(() => {});
}

async function loadRepo(repo) {
  state.repo = repo; state.path = null; state.sel = null;
  $("files").innerHTML = '<div class="empty"><span class="spin"></span></div>';
  state.files = await api(`/api/files?repo=${encodeURIComponent(repo)}`);
  const withCov = state.files.filter((f) => f.coverage);
  const tot = withCov.reduce((a, f) => a + f.coverage.blamed_lines, 0) || 1;
  const exp = withCov.reduce((a, f) => a + f.coverage.explained_lines, 0);
  const rev = withCov.reduce((a, f) => a + f.coverage.reviewed_lines, 0);
  $("summary").innerHTML = `<h3>Explainability · ${esc(repo)}</h3>
    <div class="big">${Math.round((exp / tot) * 100)}%</div>
    <div class="tag">of blamed lines trace to a pull request that states a reason</div>
    <div class="bar"><i style="width:${(exp / tot) * 100}%;background:${COLORS.explained}"></i><i style="width:${((rev - exp) / tot) * 100}%;background:${COLORS.reviewed}"></i><i style="width:${((tot - rev) / tot) * 100}%;background:${COLORS.none}"></i></div>
    <div class="legend"><span><b style="background:${COLORS.explained}"></b>reason stated</span><span><b style="background:${COLORS.reviewed}"></b>reviewed, no reason</span><span><b style="background:${COLORS.none}"></b>no review trail</span></div>
    <div class="tag" style="margin-top:6px">${withCov.length} of ${state.files.length} files analysed</div>`;
  renderFiles();
  updateTarget();
  loadMemory();
}

function renderFiles() {
  const f = $("filter").value.toLowerCase();
  const list = state.files.filter((x) => x.path.toLowerCase().includes(f)).sort((a, b) => (b.coverage ? 1 : 0) - (a.coverage ? 1 : 0) || a.path.localeCompare(b.path));
  $("files").innerHTML = list.map((x) => `<button class="file ${x.path === state.path ? "active" : ""}" data-path="${esc(x.path)}">${esc(x.path)}${x.coverage ? barHtml(x, "mini") : ""}</button>`).join("");
}

async function openFile(path) {
  state.path = path; state.sel = null;
  renderFiles();
  $("code").innerHTML = '<div class="empty"><span class="spin"></span></div>';
  const file = await api(`/api/file?repo=${encodeURIComponent(state.repo)}&path=${encodeURIComponent(path)}`);
  state.ranges = file.ranges;
  const status = new Array(file.text.split("\n").length + 1).fill(null);
  for (const r of file.ranges) for (let i = r.line_start; i <= r.line_end; i++) status[i] = r;
  const lines = file.text.replace(/\n$/, "").split("\n");
  $("code").innerHTML = `<div class="codehead">${esc(path)}<span class="hint">${file.ranges.length ? "hover a line for its commit · click to select · shift-click for a range" : "not analysed yet: ask about the file as a whole"}</span></div><pre>${lines.map((t, i) => {
    const r = status[i + 1];
    const color = !r ? "var(--none)" : r.explained ? COLORS.explained : r.pr_number ? COLORS.reviewed : COLORS.none;
    const tip = r ? `${r.commit_sha.slice(0, 8)} ${r.subject}${r.pr_number ? ` · PR #${r.pr_number}` : " · no pull request"}` : "";
    return `<div class="ln" data-n="${i + 1}" title="${esc(tip)}"><span class="g" style="background:${color}"></span><span class="n">${i + 1}</span><span class="t">${esc(t) || " "}</span></div>`;
  }).join("")}</pre>`;
  updateTarget();
}

function selectLine(n, extend) {
  if (extend && state.sel) state.sel = { from: Math.min(state.sel.from, n), to: Math.max(state.sel.to, n) };
  else state.sel = { from: n, to: n };
  document.querySelectorAll(".ln").forEach((el) => { const k = +el.dataset.n; el.classList.toggle("sel", k >= state.sel.from && k <= state.sel.to); });
  if (!$("question").value.trim() || $("question").dataset.auto === "1") {
    $("question").value = `Why ${state.sel.from === state.sel.to ? `is line ${state.sel.from}` : `are lines ${state.sel.from}-${state.sel.to}`} of ${state.path} written this way?`;
    $("question").dataset.auto = "1";
  }
  updateTarget();
}

function updateTarget() {
  $("target").textContent = state.path ? `${state.path}${state.sel ? `:${state.sel.from}${state.sel.to !== state.sel.from ? `-${state.sel.to}` : ""}` : ""}` : "whole repository";
}

function evidenceHtml(e) {
  const link = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.ref)}</a>` : esc(e.ref);
  return `<div class="ev" id="ev-${esc(e.id)}"><span class="cite">${esc(e.id)}</span> <span class="k">${esc(e.kind.replace("_", " "))}</span> ${link} — ${esc(e.title)}<pre>${esc(e.text)}</pre></div>`;
}

async function ask() {
  const question = $("question").value.trim();
  if (!question || !state.repo) return;
  $("go").disabled = true;
  $("result").innerHTML = `<div class="card"><span class="spin"></span> Planner → Investigator → Writer ⇄ Critic… <div class="tag">querying the provenance USL in Zetaris; usually 20-60 s</div></div>`;
  try {
    const input = { repo: state.repo, question };
    if (state.path) input.path = state.path;
    if (state.sel) input.line = state.sel.from;
    if (state.sel && state.sel.to !== state.sel.from) input.question += ` (lines ${state.sel.from}-${state.sel.to})`;
    const r = await api("/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input }) });
    const trace = await api(`/api/trace?id=${encodeURIComponent(r.run_id)}`).catch(() => []);
    if (r.status !== "success") throw new Error(r.error?.message ?? "run failed");
    const o = r.output;
    $("result").innerHTML = `
      <div class="card"><h4>Answer</h4><div class="answer">${esc(o.answer)}</div>
        <div class="chips"><span class="chip ${esc(o.confidence)}">confidence: ${esc(o.confidence)}</span><span class="chip">${o.approved ? "Critic approved" : "not fully approved"}</span><span class="chip">${o.rounds} revision${o.rounds === 1 ? "" : "s"}</span><span class="chip">${r.execution_time_seconds}s</span></div></div>
      <div class="card"><h4>Evidence chain</h4><ul class="chain">${o.chain.map((e) => `<li><div class="k">${esc(e.kind.replace("_", " "))}</div>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.ref)}</a>` : esc(e.ref)} — ${esc(e.title)}</li>`).join("") || '<li>No chain: see unknowns.</li>'}</ul></div>
      <div class="card"><h4>Claims</h4>${o.claims.map((c) => `<p class="claim">${esc(c.text)} ${c.evidence.map((id) => `<a class="cite" href="#ev-${esc(id)}">[${esc(id)}]</a>`).join(" ")}</p>`).join("")}</div>
      ${o.memory_ids?.length ? `<div class="card"><h4>Remembered (Meterless H-MEM)</h4><div class="tag">${o.memory_ids.length} approved findings stored with their commits, pull requests and issues as provenance. Was this right?</div><div class="row"><button class="fb" data-kind="helpful">Helpful</button><button class="fb" data-kind="not_helpful">Not helpful</button><button class="fb" data-kind="wrong">Wrong</button><span class="tag" id="fbmsg"></span></div></div>` : ""}
      ${o.unknowns.length ? `<div class="card"><h4>What the evidence doesn't show</h4>${o.unknowns.map((u) => `<p class="claim">${esc(u)}</p>`).join("")}</div>` : ""}
      <div class="card"><h4>Agent trace · ${esc(r.trace_id)}</h4><ul class="trace">${trace.map((t) => `<li class="${esc(t.status)}"><span class="who">${esc(t.agent_name)}</span>${t.target_agent ? ` → ${esc(t.target_agent)}` : ""} · ${esc(t.action)} <div>${esc(t.output_summary)}</div><div class="st">${esc(t.status)}${t.details?.zetaris_queries ? ` · Zetaris: ${esc(t.details.zetaris_queries.join(", "))}` : ""}</div></li>`).join("")}</ul></div>
      <div class="card"><h4>All evidence (${o.evidence.length})</h4>${o.evidence.map(evidenceHtml).join("")}</div>`;
    state.lastMemory = o.memory_ids ?? [];
    loadMemory();
  } catch (e) {
    $("result").innerHTML = `<div class="card err">${esc(e.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
}

async function loadMemory() {
  if (!state.repo) return;
  const m = await api(`/api/memory?repo=${encodeURIComponent(state.repo)}`).catch(() => null);
  if (!m) return;
  const live = m.memories.filter((x) => !x.supersededBy);
  $("memory").innerHTML = `<h3>Memory · H-MEM</h3><div class="tag">${live.length} findings remembered${m.memories.length > live.length ? `, ${m.memories.length - live.length} superseded` : ""} · ledger: ${Object.entries(m.ledger).map(([k, v]) => `${esc(k)} ${v}`).join(", ") || "empty"}</div>
    ${live.slice(0, 6).map((x) => `<div class="mem" title="${esc((x.provenance.refs ?? []).join("\n"))}">${esc(x.content)}<div class="tag">${esc(x.layer)} · confidence ${x.confidence} · read ${x.accessCount}×${x.tags.includes("review") ? " · flagged for review" : ""}</div></div>`).join("")}`;
}

async function sendFeedback(kind) {
  if (!state.lastMemory?.length) return;
  const r = await api("/api/memory/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ repo: state.repo, ids: state.lastMemory, kind }) });
  $("fbmsg").textContent = `recorded in the trust ledger: confidence now ${r.updated.map((u) => u.confidence).join(", ")}`;
  loadMemory();
}

$("result").addEventListener("click", (e) => { const b = e.target.closest(".fb"); if (b) sendFeedback(b.dataset.kind); });
$("repo").addEventListener("change", (e) => loadRepo(e.target.value));
$("filter").addEventListener("input", renderFiles);
$("files").addEventListener("click", (e) => { const b = e.target.closest(".file"); if (b) openFile(b.dataset.path); });
$("code").addEventListener("click", (e) => { const l = e.target.closest(".ln"); if (l) selectLine(+l.dataset.n, e.shiftKey); });
$("question").addEventListener("input", () => ($("question").dataset.auto = "0"));
$("go").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });
loadRepos().catch((e) => ($("summary").innerHTML = `<div class="err">${esc(e.message)}</div>`));
</script>
</body>
</html>
